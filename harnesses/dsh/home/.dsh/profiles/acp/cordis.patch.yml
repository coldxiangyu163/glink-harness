# Per-run ACP profile user layer (harnesses/dsh/home/ overlay).
#
# Jina fetch is configured in its own bundle. This user layer mounts the native
# present tool left unmounted by dsh-base; the host enforces the same maxFiles
# bound when it recovers files. The launcher preserves this seeded profile.
# dsh-base installs but deliberately does not mount present. ACP runs need the
# native declaration tool; the host still validates/copies each named file.
- insert:
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
      config:
        maxFiles: 8
