# 每 run HOME 的 dsh 用户文档。provider 接入结构不在此声明：
# 单源是同目录 patches/llm-pi-ai.yml，经 dsh `--patch` 在插件挂载时
# 同步注册路由（DSH-03；settings 驱动的注册是异步链，冷启动晚于首个
# session/new 应答）。此处仍可写 llm-pi-ai 段做运行期热改：installSection
# 以插件 config 为 base 合并用户段，onChange 会 replace 路由。
# OPENAI_MODEL / OPENAI_REASONING_EFFORT 由宿主经 ACP 应用并核验；
# 凭据值经宿主渲染（GLINK_ACP_CREDENTIAL_ENV 或
# GLINK_ACP_CREDENTIAL_FILES），永远不进仓库。本机 ~/.dsh/ 互不影响。
