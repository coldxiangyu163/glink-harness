# dsh 包（deepseek-harness，原生 ACP server）。
#
# 0.2.1-rc.2 原生提供 DeepSeek Search/Fetch API。使用独立 glink-acp profile，
# 避免旧会话继承的 acp profile 继续引用已删除的 Jina bundle；不改历史会话。
# 镜像 ARG `DSH_VERSION` 与 E2B 模板参数由 scripts/generate-pack-artifacts.py
# 从下方 [[image.packages]] 生成。
#
# 权限保持 fail-closed；主模型与 effort 经 ACP session_config 应用并核验，值只来自 .env。
format = "glink-harness/v2"
name = "dsh"
family = "acp"

[entry]
command = ["dsh", "--profile", "glink-acp"]

[capabilities]
# 包层允许续接；运行期仍以 ACP 协商的 sessionCapabilities.resume / loadSession 为准。
resume = true
# dsh 的 `subagent` 工具在派发被接受时就以 completed 结束（回复
# `started subagent <childId>`），子代理随后独立运行、经主代理 inbox 回报
# （GLINK-OBS-01 真实数据：工具终态与子代理会话创建相差 17ms，子代理继续跑约 5 分钟）。
# 宿主据此不把该终态当作子代理完成，child 由 run 终帧收口。
subagent_dispatch = "async"
# 子代理运行中进度读 dsh 私有的 session.v4.jsonl.zstd（位于 agent HOME/.dsh/sessions）。
child_progress = "dsh-session-zstd"
# dsh `--patch` launcher 覆盖层（run HOME 相对路径，由 home/ overlay 交付）：
# llm-pi-ai 的 providers 结构在插件挂载时同步注册路由，绕开 settings 异步
# 注册链的启动竞态——冷启动下首个 session/new 曾稳定不广告 openrouter 组
#（DSH-03 根因修复，docs/acp-integration-notes.md §20）。
patch_overlays = [".dsh/patches/llm-pi-ai.yml"]

[capabilities.session_config]
# 仅声明来源与协议编码规则，不固定部署值。new/resume 均按当前宿主冻结配置应用。
model = { source = "OPENAI_MODEL", encoding = "dsh-model" }
reasoning_effort = { source = "OPENAI_REASONING_EFFORT" }

[image]
target = "acp-worker"
cpu_count = 2
memory_mb = 4096

[[image.packages]]
arg = "DSH_VERSION"
package = "@deepseek-ai/dsh"
version = "0.2.1-rc.2"
role = "agent"
