# dsh 包（deepseek-harness，原生 ACP server）。
#
# 版本与入口来自 M2 实测（docs/acp-integration-notes.md §4.1）：0.1.5-rc.3 的 dsh CLI
# 没有 `acp` 子命令，入口是 `dsh --profile acp`。镜像 ARG `DSH_VERSION` 与 E2B 模板参数
# 由 scripts/generate-pack-artifacts.py 从下方 [[image.packages]] 生成。
#
# 真实 run 实测不需要权限白名单（fail-closed 默认即可），也不使用 session_config。
format = "pi-glink-harness/v2"
name = "dsh"
family = "acp"

[entry]
command = ["dsh", "--profile", "acp"]

[capabilities]
# 包层允许续接；运行期仍以 ACP 协商的 sessionCapabilities.resume / loadSession 为准。
resume = true
# dsh 的 `subagent` 工具在派发被接受时就以 completed 结束（回复
# `started subagent <childId>`），子代理随后独立运行、经主代理 inbox 回报
# （GLINK-OBS-01 真实数据：工具终态与子代理会话创建相差 17ms，子代理继续跑约 5 分钟）。
# 宿主据此不把该终态当作子代理完成，child 由 run 终帧收口。
subagent_dispatch = "async"
# 子代理运行中进度读 dsh 私有的 session.v4.jsonl.zstd（位于 agent HOME/.dsh/sessions）。
child_progress = "dsh-session-zstd"

[image]
target = "acp-worker"
cpu_count = 2
memory_mb = 4096

[[image.packages]]
arg = "DSH_VERSION"
package = "@deepseek-ai/dsh"
version = "0.1.5-rc.3"
role = "agent"
