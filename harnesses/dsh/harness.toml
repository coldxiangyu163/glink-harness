# dsh 包（deepseek-harness，原生 ACP server）。
#
# 版本与入口来自 M2 实测（docs/acp-integration-notes.md §4.1）：0.1.5-rc.3 的 dsh CLI
# 没有 `acp` 子命令，入口是 `dsh --profile acp`。`package`/`version` 必须与
# docker/Dockerfile.acp-worker 与 docker/e2b/Dockerfile.acp-e2b 的 `ARG DSH_VERSION`
# 逐字一致（tests/test_repository_boundaries.py 卡住）。
#
# 真实 run 实测不需要权限白名单（fail-closed 默认即可），也不使用 session_config。
#
# subagent_dispatch = "async"：dsh 的 `subagent` 工具在派发被接受时就以 completed
# 结束（回复 `started subagent <childId>`），子代理随后独立运行、经主代理 inbox 回报
# （GLINK-OBS-01 真实数据：工具终态与子代理会话创建相差 17ms，子代理继续跑约 5 分钟）。
# 宿主据此不把该终态当作子代理完成，child 由 run 终帧收口。
format = "pi-glink-harness/v1"
name = "dsh"
family = "acp"
command = ["dsh", "--profile", "acp"]
package = "@deepseek-ai/dsh"
version = "0.1.5-rc.3"
subagent_dispatch = "async"
