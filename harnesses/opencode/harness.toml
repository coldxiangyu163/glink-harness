# opencode 包（opencode-ai）。
#
# 版本与入口来自 M5 实测（docs/acp-integration-notes.md §8.1）：入口是
# `opencode acp`，当前钉 1.18.32。镜像 ARG `OPENCODE_AI_VERSION` 与 E2B 模板参数由
# scripts/generate-pack-artifacts.py 生成。
#
# 真实 run 实测 0 条权限请求，不需要白名单（fail-closed 默认即可），也不使用 session_config。
format = "pi-glink-harness/v2"
name = "opencode"
family = "acp"

[entry]
command = ["opencode", "acp"]

[capabilities]
resume = true

[image]
target = "acp-worker"
cpu_count = 2
memory_mb = 4096

[[image.packages]]
arg = "OPENCODE_AI_VERSION"
package = "opencode-ai"
version = "1.18.32"
role = "agent"
