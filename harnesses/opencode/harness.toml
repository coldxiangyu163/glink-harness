# opencode 包（opencode-ai）。
#
# 版本与入口来自 M5 实测（docs/acp-integration-notes.md §8.1）：入口是
# `opencode acp`，当前镜像 ARG 钉 1.18.32。`package`/`version` 必须与两个 ACP 镜像的
# `ARG OPENCODE_AI_VERSION` 逐字一致（tests/test_repository_boundaries.py 卡住）。
#
# 真实 run 实测 0 条权限请求，不需要白名单（fail-closed 默认即可），也不使用 session_config。
format = "pi-glink-harness/v1"
name = "opencode"
family = "acp"
command = ["opencode", "acp"]
package = "opencode-ai"
version = "1.18.32"
