# codex 包（codex-acp）。
#
# 版本与入口来自集成笔记：M2 用旧包 @zed-industries/codex-acp 实测入口 `codex-acp`；
# M3a 起改用后继包 @agentclientprotocol/codex-acp，当前钉 1.13.1。镜像 ARG
# `CODEX_ACP_VERSION` 与 E2B 模板参数由 scripts/generate-pack-artifacts.py 生成。
#
# 不声明 session_config：M2 的 `mode=auto` 是旧包取值；1.13.1 的会话模式词表已变为
# read-only / agent / agent-full-access（默认 agent，集成笔记 §14.5），M8 的真实
# 「首轮+追问」run 就是在不设 session_config 的默认模式下跑通的。声明一个钉版不认的
# 取值会让包应用 session_config 时失败闭环。
format = "glink-harness/v2"
name = "codex"
family = "acp"

[entry]
command = ["codex-acp"]

[capabilities]
resume = true

[image]
target = "acp-worker"
cpu_count = 2
memory_mb = 4096

[[image.packages]]
arg = "CODEX_ACP_VERSION"
package = "@agentclientprotocol/codex-acp"
version = "1.13.1"
role = "agent"
