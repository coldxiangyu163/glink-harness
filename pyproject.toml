[project]
name = "pi-glink"
version = "0.1.0"
description = "以 pi 为内核的本地研究工作台宿主 / local research workbench host driven by the pi kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# 宿主与内核本身只用标准库；以下按执行面/开发需要选装。
dev = ["pytest>=8.0"]
# E2B 执行面（LOCAL_WEB_EXECUTOR=e2b）。代理网络下 httpx 需要 socks 支持。
e2b = ["e2b>=2.0", "httpx[socks]>=0.27"]

[project.scripts]
pi-glink = "pi_glink.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "host"}
packages = ["pi_glink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["host"]
addopts = "-q"
