[project]
name = "pi-glink"
version = "0.1.0"
description = "以 pi 为内核的本地研究工作台宿主 / local research workbench host driven by the pi kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# 宿主与内核本身只用标准库；以下按执行面/开发需要选装。
dev = ["pytest>=8.0"]
# E2B 执行面（LOCAL_WEB_EXECUTOR=e2b）。代理网络下 httpx 需要 socks 支持。
e2b = ["e2b>=2.0", "httpx[socks]>=0.27"]
# ACP 子代理运行中进度观察者（docs/architecture.md §3.5「运行中进度（R3a）」）：
# 解析 dsh 的 zstd 会话格式。缺失时 ACP 面的子代理进度如实为无（降级而非报错）。
acp-progress = ["zstandard>=0.22"]

[project.scripts]
pi-glink = "pi_glink.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "host"}

# 部署单位是整个仓库目录（web/、agent/、scripts/ 都按仓库相对路径定位）；下面的包声明只保证
# 宿主代码可导入，包含 pi_glink 与 pi_glink.kernel。独立安装 wheel 不是受支持形态。
[tool.setuptools.packages.find]
where = ["host"]
include = ["pi_glink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["host"]
addopts = "-q"
