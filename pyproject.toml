[project]
name = "pi-glink"
version = "0.1.0"
description = "以 pi 为内核的本地研究工作台宿主 / local research workbench host driven by the pi kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pi-glink = "pi_glink.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "host"}
packages = ["pi_glink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["host"]
addopts = "-q"
