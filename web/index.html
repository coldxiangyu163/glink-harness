<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme: light">
  <link rel="icon" href="/glink-mark.svg" type="image/svg+xml">
  <title>pi-glink · pi 内核研究工作台</title>
  <!-- 资源指纹在响应期替换；见 host/pi_glink/static_files.py -->
  <link rel="stylesheet" href="/styles.css?v=auto">
</head>
<body>
  <a class="skip-link" href="#main-content" hidden>跳到主要内容</a>

  <div id="app-shell" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="运行导航">
      <div class="sidebar-top">
        <a class="brand" href="#home" aria-label="pi-glink 首页">
          <img class="brand-mark" src="/glink-mark.svg" alt="">
          <span><strong>pi-glink</strong><small>pi 内核研究台</small></span>
        </a>
      </div>
      <button id="new-research" class="button new-button" type="button"><span>＋</span> <span>新建研究</span></button>
      <nav>
        <div class="nav-section">
          <span class="nav-section-title">运行历史</span>
          <div id="run-list" class="nav-list"></div>
        </div>
      </nav>
      <div class="sidebar-foot">
        <p id="host-status" class="muted"></p>
      </div>
    </aside>

    <main id="main-content">
      <section id="home-view" class="home-view view">
        <div class="home-intro">
          <p class="eyebrow">PI 内核研究工作台</p>
          <h2>把问题交给 pi，<span class="keep">过程与产物</span>都留在本机</h2>
          <p>宿主只做编排与呈现：检索、推理与写作由 pi 完成，报告写入 run 工作区并可直接下载。</p>
        </div>
      </section>

      <section id="chat-view" class="chat-view view" hidden>
        <div id="chat-layout" class="chat-layout">
          <div id="conversation" class="conversation">
            <article id="run-question" class="message user-message"></article>
            <div id="run-view" class="pi-run"></div>
          </div>
        </div>
        <div id="run-banner" class="run-banner" hidden>
          <span class="pulse-dot"></span>
          <p><strong id="run-banner-title">pi 正在本机运行</strong><small>事件与报告会持续保存，可以离开这一页。</small></p>
          <button id="stop-run" class="button danger-quiet" type="button">停止</button>
        </div>
      </section>
    </main>

    <aside id="preview-drawer" class="preview-drawer" hidden aria-label="报告预览">
      <div class="preview-head">
        <div class="preview-title-row"><strong id="preview-title">报告</strong></div>
        <div class="preview-actions">
          <a id="preview-download" class="button quiet" href="#" download>下载 Markdown</a>
          <button id="preview-close" class="icon-button" type="button" aria-label="关闭预览">×</button>
        </div>
      </div>
      <div id="preview-body" class="preview-body"></div>
    </aside>
  </div>

  <div id="composer" class="composer" hidden>
    <label class="composer-label" for="prompt-input">提问</label>
    <textarea id="prompt-input" rows="4" maxlength="32000" placeholder="描述研究对象、范围与交付要求…"></textarea>
    <small id="prompt-count" class="prompt-count" hidden>0 / 32000</small>
    <div class="composer-foot">
      <div class="composer-options">
        <span id="stream-status" class="mode-badge"></span>
      </div>
      <button id="send-button" class="button primary" type="button" disabled>开始研究</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js?v=auto" defer></script>
</body>
</html>
