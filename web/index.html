<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <!-- 品牌标识直接取标准库的 public/logo-icon.svg（同一份文件，逐字节相同） -->
  <link rel="icon" href="/logo-icon.svg" type="image/svg+xml">
  <title>pi-glink · pi 内核研究工作台</title>
  <!-- 资源指纹在响应期替换；见 host/pi_glink/static_files.py -->
  <link rel="stylesheet" href="/styles.css?v=auto">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <div id="app-shell" class="shell" data-sidebar="expanded" hidden>
    <aside id="sidebar" class="sidebar" aria-label="运行导航">
      <div class="sidebar-head">
        <a class="brand" href="#home" aria-label="pi-glink 首页">
          <img class="brand-mark" src="/logo-icon.svg" alt="百融百鉴">
        </a>
        <div class="sidebar-head-actions">
          <button id="sidebar-toggle" class="glyph-button" type="button" aria-label="收起侧栏" aria-expanded="true" aria-controls="sidebar" data-tip="收起侧栏">
            <span class="icon" data-icon="sidebar" aria-hidden="true" style="--icon-size:16px"></span>
          </button>
        </div>
      </div>

      <button id="new-research" class="nav-new" type="button">
        <span class="icon" data-icon="plus" aria-hidden="true" style="--icon-size:16px"></span>
        <span>新建研究</span>
      </button>

      <div id="nav-scroll" class="nav-scroll scroll-area" data-nav-scroller>
        <div class="nav-group">
          <p class="nav-label">运行历史</p>
          <div id="run-list" class="nav-list"></div>
        </div>
      </div>

      <div class="sidebar-foot">
        <div id="host-status-card" class="info-card" data-ready="false">
          <span class="icon" data-icon="plan" aria-hidden="true" style="--icon-size:14px"></span>
          <p id="host-status" class="muted">正在读取宿主状态…</p>
        </div>
      </div>
    </aside>

    <main id="main-content" class="surface">
      <section class="pane">
        <header class="pane-header">
          <div class="pane-path">
            <button id="pane-home" type="button">pi-glink</button>
            <span class="pane-sep" aria-hidden="true">/</span>
            <span id="pane-title" class="pane-current" aria-current="page">新研究</span>
          </div>
          <div class="pane-actions">
            <button id="pane-preview-toggle" class="icon-button" type="button" aria-label="展开报告栏" aria-expanded="false" data-tip="报告栏" hidden>
              <span class="icon" data-icon="panel-expand-right" aria-hidden="true" style="--icon-size:16px"></span>
            </button>
          </div>
        </header>

        <div class="pane-body">
          <section id="home-view" class="home-view view">
            <div class="home-inner">
              <div class="home-hero">
                <h2>把问题交给 pi，过程与产物都留在本机</h2>
                <p>宿主只做编排与呈现：检索、推理与写作由 pi 完成，报告写入 run 工作区并可直接下载。</p>
              </div>
              <div id="home-composer-slot" class="home-composer-slot"></div>
              <div class="home-cards">
                <section class="home-card">
                  <h3>最近运行</h3>
                  <div id="home-run-list" class="home-card-list"></div>
                </section>
                <section class="home-card">
                  <h3>工作方式</h3>
                  <div class="home-card-list">
                    <div class="home-row">
                      <span class="icon" data-icon="plan" aria-hidden="true"></span>
                      <span class="home-row-body">
                        <span class="home-row-title">一次 run 一个工作区</span>
                        <span class="home-row-meta">产物落在 run 自己的工作区，报告可直接下载</span>
                      </span>
                    </div>
                    <div class="home-row">
                      <span class="icon" data-icon="globe" aria-hidden="true"></span>
                      <span class="home-row-body">
                        <span class="home-row-title">检索由 pi-web-access 提供</span>
                        <span class="home-row-meta">没有外网凭据时回退到无密钥检索</span>
                      </span>
                    </div>
                    <div class="home-row">
                      <span class="icon" data-icon="history" aria-hidden="true"></span>
                      <span class="home-row-body">
                        <span class="home-row-title">事件流可重放</span>
                        <span class="home-row-meta">离开页面不会中断 run，回到历史记录继续看</span>
                      </span>
                    </div>
                  </div>
                </section>
              </div>
            </div>
          </section>

          <section id="chat-view" class="chat-view view" hidden>
            <div id="conversation-scroll" class="conversation-scroll scroll-area">
              <div id="conversation" class="conversation">
                <article id="run-question" class="message user-message"></article>
                <div id="run-view" class="pi-run scroll-area"></div>
              </div>
            </div>
          </section>
        </div>

        <div id="composer-dock" class="composer-dock">
          <div id="composer-host" class="composer-host">
            <div id="run-banner" class="run-banner" hidden>
              <span class="pulse-dot" aria-hidden="true"></span>
              <p><strong id="run-banner-title">pi 正在本机运行</strong><small>事件与报告会持续保存，可以离开这一页。</small></p>
              <button id="stop-run" class="btn outline sm" type="button">停止</button>
            </div>
            <div id="composer" class="composer" hidden>
              <div class="composer-form">
                <div class="prompt-input">
                  <label class="sr-only" for="prompt-input">提问</label>
                  <textarea id="prompt-input" rows="1" maxlength="32000" placeholder="描述研究对象、范围与交付要求…"></textarea>
                  <div class="prompt-tools">
                    <div class="prompt-tools-left">
                      <span id="prompt-shortcut" class="prompt-hint">
                        <kbd id="prompt-modifier" class="kbd">⌘</kbd><kbd class="kbd">↵</kbd>
                        <span>提交</span>
                      </span>
                      <span id="stream-status" class="prompt-status"></span>
                      <span id="prompt-count" class="prompt-count" hidden>0 / 32000</span>
                    </div>
                    <div class="prompt-tools-right">
                      <button id="send-button" class="prompt-send" type="button" aria-label="开始研究" disabled>
                        <span class="icon" data-icon="arrow-up" aria-hidden="true"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside id="preview-drawer" class="preview-drawer" hidden aria-label="报告">
        <header class="pane-header">
          <div class="preview-title-row"><strong id="preview-title">报告</strong></div>
          <div class="preview-actions">
            <a id="preview-download" class="btn outline sm" href="#" download>
              <span class="icon" data-icon="download" aria-hidden="true"></span>
              <span>下载</span>
            </a>
            <button id="preview-close" class="icon-button" type="button" aria-label="收起报告栏" data-tip="收起报告栏">
              <span class="icon" data-icon="close" aria-hidden="true" style="--icon-size:16px"></span>
            </button>
          </div>
        </header>
        <div id="preview-body" class="preview-body scroll-area"></div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js?v=auto" defer></script>
</body>
</html>
